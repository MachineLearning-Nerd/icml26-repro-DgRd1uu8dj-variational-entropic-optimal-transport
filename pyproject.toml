[project]
name = "vareot-reproduction"
version = "0.1.0"
description = "Claim-by-claim reproduction of Variational Entropic Optimal Transport"
requires-python = "==3.12.*"
dependencies = [
  "marimo==0.15.2",
  "matplotlib==3.10.5",
  "numpy==2.3.2",
  "scipy==1.16.1",
  "sympy==1.14.0",
  "torch==2.8.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vareot_repro"]
